name: check

# Two gates and one report.
#
# The gates are only the things CI can decide on its own: the linter, and
# byte-reproducibility. Both are exact - they either pass or they do not - and
# both are already 52/52 clean, so they cost seconds and never cry wolf.
#
# There is deliberately no "frame 0 must be complete" gate. We tried to build one
# four times and it failed every time; scripts/measure_frame0.py records the
# attempts, the measurements and the reasons. That check runs here as a report,
# not as a gate, so the numbers are visible in every run and a regression shows
# up as a diff in the log.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: the machinery is tested, not just the output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Every other gate proves the *output* is clean: examples lint, verify,
      # regenerate byte-identically, have current twins and tiles. Nothing
      # proved the machinery that made them was correct - a resampler bug or a
      # theme-polarity bug produces a file that lints clean and looks plausible.
      #
      # This suite already earned its keep: it found that morphing a closed
      # shape against an open one yields mismatched command signatures, so the
      # pair silently snapped. That is now a hard refusal.
      #
      # stdlib only, and it needs no Playwright - a suite that needs a browser is
      # a suite people skip.
      - name: Run the self-tests
        run: python -m unittest discover -s tests -v
      - name: Explain a failure
        if: failure()
        run: |
          echo "A failing self-test means the generator is wrong, not the example." >&2
          echo "Fix the script. Do not weaken the assertion to make it pass -" >&2
          echo "two checks have already been cut in this repo for crying wolf," >&2
          echo "and the standard for keeping one is: prove it on a bad case." >&2

  workflow-is-valid:
    name: this workflow is itself valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Guards against the mistake this job exists because of: #16 shipped a step
      # containing only `with:`, and GitHub rejected the whole file. No job ran,
      # so the run failed with zero jobs and nothing said why. yaml.safe_load
      # parses that happily -- only the per-step shape check catches it.
      #
      # pyyaml is NOT part of setup-python's image, hence the explicit install.
      # A first attempt at this job inlined the check as a heredoc and failed
      # with ModuleNotFoundError, which is the same class of error: a check that
      # looks like it ran but did not.
      - name: Install pyyaml
        run: pip install --quiet pyyaml
      - name: Every workflow is structurally valid
        run: python scripts/check_workflow.py

  lint:
    name: lint every example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint assets/examples, docs and thumbs
        run: |
          set -o pipefail
          python scripts/lint_svg_anim.py \
            assets/examples/*.svg docs/*.svg docs/thumbs/*.svg
      - name: Explain a failure
        if: failure()
        run: |
          echo "A non-zero exit means an ERROR, not a warning." >&2
          echo "ERRORS are real defects: a malformed animation is discarded by the" >&2
          echo "browser, so the file silently stops doing the thing it advertises." >&2
          echo "Fix the generator or the spec, regenerate, and commit the result." >&2

  reproducible:
    name: examples regenerate byte-identically
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate every example from its spec and diff
        run: |
          set -euo pipefail
          fail=0
          mkdir -p /tmp/regen
          for spec in assets/specs/*.json; do
            stem="$(basename "$spec" .json)"
            [ -f "assets/examples/$stem.svg" ] || { echo "MISSING example for $stem"; fail=1; continue; }
            python scripts/gen_diagram.py "$spec" "/tmp/regen/$stem.svg" >/dev/null
            if ! diff -q --strip-trailing-cr "assets/examples/$stem.svg" "/tmp/regen/$stem.svg" >/dev/null; then
              echo "DIFFERS: $stem.svg does not match what its spec generates"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo >&2
            echo "Every file in assets/examples/ is generated and must be committed" >&2
            echo "alongside the change that produced it. Either the example was" >&2
            echo "hand-edited, or a generator change was not regenerated." >&2
            echo "Run:  python scripts/gen_diagram.py assets/specs/<stem>.json assets/examples/<stem>.svg" >&2
            exit 1
          fi
          echo "all examples reproduce byte-for-byte"

  thumbs-current:
    name: gallery tiles are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate every gallery tile and diff
        run: |
          set -euo pipefail
          fail=0
          mkdir -p /tmp/thumbs
          for tile in docs/thumbs/*.svg; do
            stem="$(basename "$tile" .svg)"
            [ -f "$tile" ] || { fail=1; continue; }
            python scripts/build_thumbs.py --only "$stem" >/dev/null
            if ! git diff --quiet -- "$tile"; then
              echo "DIFFERS: docs/thumbs/$stem.svg does not match a fresh build"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo >&2
            echo "The README gallery embeds docs/thumbs/, so a stale tile shows a" >&2
            echo "preview that no longer matches the example it came from. This" >&2
            echo "happened for all 12 tiles when the static-first fixes landed and" >&2
            echo "nothing noticed, because they were referenced by nothing." >&2
            echo "Run:  python scripts/build_thumbs.py" >&2
            exit 1
          fi
          echo "all gallery tiles are current"

  verify-examples:
    name: no example parks a visible element at frame 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # verify.py loads each file in a real browser at t=0 and asks the one
      # question XML reading cannot: is anything visible that should not be yet?
      # It caught the terminal (#8) and logo (#9) trap by hand; this stops the
      # next one landing. Two sibling checks were cut from it for crying wolf -
      # see its module docstring before adding one back.
      - run: pip install --quiet playwright
      - run: python -m playwright install --with-deps chromium
      - name: Every example runs without a parked element
        run: python scripts/verify.py assets/examples/*.svg
      - name: Explain a failure
        if: failure()
        run: |
          echo "A parked element has a positive begin, so it has no effect yet," >&2
          echo "but it is visible - a traveller sitting at the canvas origin." >&2
          echo "Fix at the root cause: give it opacity=\"0\" as a base value, or" >&2
          echo "pre-roll it with a negative begin and return that as preroll=." >&2

  gallery-current:
    name: gallery lists every example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # GitHub will not render a raw .svg when a reader clicks one, so
      # docs/gallery/README.md is the only place these can be seen. It was
      # hand-written, and #18 shipped morph-shapes without adding it: 13 of 53
      # shown, 30 never mentioned. Now it is generated and gated.
      #
      # Also fails on an .svg with no spec, which is how an example would
      # otherwise exist, animate, and never be listed anywhere.
      - name: Regenerate the gallery and diff
        run: |
          set -euo pipefail
          python scripts/build_gallery.py
          if ! diff -q --strip-trailing-cr docs/gallery/README.md <(git show HEAD:docs/gallery/README.md 2>/dev/null || true) >/dev/null 2>&1; then
            echo "DIFFERS: docs/gallery/README.md does not match assets/specs/" >&2
            echo >&2
            echo "Every example must be listed. GitHub does not render a raw .svg," >&2
            echo "so an unlisted one is invisible to a reader." >&2
            echo "Run:  python scripts/build_gallery.py" >&2
            exit 1
          fi
          echo "gallery lists every example"
      - name: Explain a failure
        if: failure()
        run: |
          echo "Either a new spec has no entry, or an .svg has no spec at all." >&2
          echo "Both are refused on purpose - see scripts/build_gallery.py." >&2

  static-twins:
    name: reduced-motion twins are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every animated example has a current -static.svg twin
        run: python scripts/static_twin.py --check assets/examples
      - name: Explain a failure
        if: failure()
        run: |
          echo >&2
          echo "SMIL cannot be switched off from CSS, so honouring" >&2
          echo "prefers-reduced-motion means shipping a second, animation-free" >&2
          echo "file and letting a <picture> element choose between them." >&2
          echo >&2
          echo "'no static twin'  -> run:  python scripts/static_twin.py \\" >&2
          echo "                       assets/examples/<name>.svg \\" >&2
          echo "                       assets/examples/<name>-static.svg" >&2
          echo >&2
          echo "'is stale'        -> the animated file changed; regenerate the twin." >&2
          echo "'only N% of text nodes survive'" >&2
          echo "                    -> the example is NOT static-first, so its twin" >&2
          echo "                       would be missing content. Give the base state the" >&2
          echo "                       finished drawing first. See references/static-first.md." >&2

  frame0-report:
    name: frame-0 report (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet playwright && python -m playwright install --with-deps chromium
      - name: Measure static-first compliance
        run: python scripts/measure_frame0.py --csv assets/examples > frame0-report.csv
      - name: Show the report
        run: |
          echo "Advisory only. Sorted by how little text is visible at frame 0."
          echo "A file that jumps here without an intentional change is the signal."
          echo
          column -s, -t frame0-report.csv || cat frame0-report.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame0-report
          path: frame0-report.csv