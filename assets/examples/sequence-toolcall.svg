<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 628" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sequence diagram of a single tool call against a legacy endpoint. The client sends tools to the shim. The shim calls the endpoint with the tools field removed and the tool described in the system prompt. The endpoint replies with a stream of delta frames. The shim converts that into a tool call and returns it to the client, which runs the tool, sends the result back as the next turn, and receives a final answer.">
